# version: "3.9"  # obsolete, removed to suppress warnings

# ============================================================
# PyBatGym Docker Compose
#
# Image chứa sẵn: Python, PyTorch, TensorFlow, SB3,...
# Code được mount từ thư mục hiện tại vào /workspace
#
# Lần đầu (tạo image tên ghcr.io/clhthien/pybatgym:latest):
#   docker-compose build shell
#   (hoặc đổi tên image cũ đã có trên máy, không cần build lại:
#    docker tag ghcr.io/thinhnguyen7204/pybatgym:latest ghcr.io/clhthien/pybatgym:latest)
#
# Cách dùng:
#   docker-compose up -d shell tensorboard viz
#   docker-compose exec shell bash
#   (sau đó tự gõ lệnh test/train bên trong terminal đó)
# ============================================================

services:

  # ── Mở Ubuntu terminal tại /workspace ─────────────────
  shell:
    build: .
    image: ghcr.io/clhthien/pybatgym:latest
    volumes:
      - .:/workspace # code mount từ Windows vào Ubuntu
      - /var/run/docker.sock:/var/run/docker.sock # cho phép Python restart BatSim container
    working_dir: /workspace
    stdin_open: true # giữ stdin mở (cần cho interactive)
    tty: true # tạo terminal thật
    entrypoint: [ "/bin/bash", "/workspace/entrypoint.sh" ]
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "28000:28000"

  # ── TensorBoard (xem training metrics) ────────────────
  tensorboard:
    image: ghcr.io/clhthien/pybatgym:latest
    volumes:
      - .:/workspace
    working_dir: /workspace
    entrypoint: [ "/bin/bash", "-c", "tensorboard --logdir logs --bind_all --port 6006" ]
    ports:
      - "6006:6006"
    environment:
      - PYTHONUNBUFFERED=1

  # ── BatSim Simulator (C++) ──────────────────────────────
  batsim:
    image: oarteam/batsim:3.1.0
    volumes:
      - .:/workspace
    # Wrapper script: chờ Python ZMQ bind xong rồi mới connect
    entrypoint: [ "/bin/sh", "/workspace/scripts/batsim_start.sh" ]
    depends_on:
      - shell
    restart: "unless-stopped" # adapter restarts between episodes via Docker API
    environment:
      # Override từ PowerShell: $env:BATSIM_WORKLOAD="..."
      - BATSIM_WORKLOAD=${BATSIM_WORKLOAD:-/workspace/data/workloads/medium_workload.json}
      - BATSIM_PLATFORM=${BATSIM_PLATFORM:-/workspace/data/platforms/medium_platform.xml}
      - BATSIM_SOCKET=${BATSIM_SOCKET:-tcp://shell:28000}

  # ── Web trực quan hóa kết quả (Flask, kiểu Passenger app của Open OnDemand) ──
  viz:
    image: ghcr.io/clhthien/pybatgym:latest
    volumes:
      - .:/workspace
    working_dir: /workspace/pybatgym_viz
    # Cùng kiểu với service tensorboard: ghi đè entrypoint (service shell dùng entrypoint.sh riêng)
    entrypoint: [ "/bin/bash", "-c", "source /opt/venv/bin/activate && pip install -q flask && python app.py" ]
    ports:
      - "127.0.0.1:5000:5000" # chỉ mở cho máy của bạn (debug mode không nên lộ ra mạng LAN)
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - FLASK_DEBUG=1 # 1 = tự reload khi sửa code; đặt 0 khi demo/chia sẻ
      - PYBATGYM_RESULTS_DIR=/workspace/pybatgym/results
      - PYBATGYM_LOGS_DIR=/workspace/logs/tensorboard_comparison
