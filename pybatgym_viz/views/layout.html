<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root { --ink:#1d2733; --muted:#5d6b7a; --line:#d5dbe2; --bg:#f6f8fa; --accent:#1f5f8b; --bad:#a32b2b; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.55 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    nav { background:#fff; border-bottom:1px solid var(--line); padding:.75rem 1.5rem; display:flex; gap:1.5rem; align-items:baseline; }
    nav strong { font-size:1.05rem; }
    nav a { color:var(--accent); text-decoration:none; }
    nav a:hover, nav a:focus-visible { text-decoration:underline; }
    main { max-width:1100px; margin:1.5rem auto; padding:0 1.5rem; }
    h1 { font-size:1.4rem; margin:0 0 .25rem; }
    .cmd { color:var(--muted); font:.85rem ui-monospace, Consolas, monospace; margin:0 0 1rem; }
    .scroll { overflow-x:auto; background:#fff; border:1px solid var(--line); }
    table { border-collapse:collapse; width:100%; font-size:.92rem; }
    th, td { padding:.45rem .75rem; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
    th { background:#eef2f6; }
    .error { background:#fbeaea; border:1px solid var(--bad); color:var(--bad); padding:.75rem 1rem; }
    .empty { color:var(--muted); padding:1rem; }
    select { font:inherit; padding:.25rem .5rem; }
    h2 { font-size:1.1rem; margin:1.5rem 0 .5rem; }
  </style>
</head>
<body>
  <nav>
    <strong>PyBatGym</strong>
    <a href="{{ url_for('index') }}">Tổng hợp benchmark</a>
    <a href="{{ url_for('episodes') }}">Từng episode</a>
    <a href="{{ url_for('comparison') }}">So sánh policy (TensorBoard)</a>
  </nav>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
